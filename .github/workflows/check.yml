name: Check barber availability

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check availability
        run: bash check.sh
        env:
          BRR_SECRET_KEY: ${{ secrets.BRR_SECRET_KEY }}
